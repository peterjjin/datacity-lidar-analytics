dataset:
  name: KITTI
  dataset_path: /mnt/d/Dropbox/_Rutgers/2026.03.14 Open3D-ML LiDAR Analytics/data/neilson_car_kitti
  cache_dir: /mnt/d/Dropbox/_Rutgers/2026.03.14 Open3D-ML LiDAR Analytics/experiments/neilson_car/runs/open3dml_pointpillars_car/cache
  val_split: 4164

model:
  name: PointPillars
  ckpt_path: /mnt/d/Dropbox/_Rutgers/2026.03.14 Open3D-ML LiDAR Analytics/experiments/neilson_car/checkpoints/open3dml_pointpillars_kitti.pth
  is_resume: false
  batcher: "ignore"
  point_cloud_range: [0, -39.68, -3, 69.12, 39.68, 1]
  classes: ['Car']

  loss:
    focal:
      gamma: 2.0
      alpha: 0.25
      loss_weight: 1.0
    smooth_l1:
      beta: 0.11
      loss_weight: 2.0
    cross_entropy:
      loss_weight: 0.2

  voxelize:
    max_num_points: 32
    voxel_size: &vsize [0.16, 0.16, 4]
    max_voxels: [16000, 40000]

  voxel_encoder:
    in_channels: 4
    feat_channels: [64]
    voxel_size: *vsize

  scatter:
    in_channels: 64
    output_shape: [496, 432]

  backbone:
    in_channels: 64
    out_channels: [64, 128, 256]
    layer_nums: [3, 5, 5]
    layer_strides: [2, 2, 2]

  neck:
    in_channels: [64, 128, 256]
    out_channels: [128, 128, 128]
    upsample_strides: [1, 2, 4]
    use_conv_for_no_stride: false

  head:
    in_channels: 384
    feat_channels: 384
    nms_pre: 100
    score_thr: 0.1
    ranges: [[0, -39.68, -1.78, 70.4, 39.68, -1.78]]
    sizes: [[1.6, 3.9, 1.56]]
    rotations: [0, 1.57]
    iou_thr: [[0.45, 0.6]]

  augment:
    PointShuffle: true
    ObjectRangeFilter:
      point_cloud_range: [0, -39.68, -3, 69.12, 39.68, 1]

pipeline:
  name: ObjectDetection
  test_compute_metric: true
  batch_size: 2
  val_batch_size: 1
  test_batch_size: 1
  save_ckpt_freq: 2
  max_epoch: 24
  main_log_dir: /mnt/d/Dropbox/_Rutgers/2026.03.14 Open3D-ML LiDAR Analytics/experiments/neilson_car/runs/open3dml_pointpillars_car
  train_sum_dir: /mnt/d/Dropbox/_Rutgers/2026.03.14 Open3D-ML LiDAR Analytics/experiments/neilson_car/runs/open3dml_pointpillars_car/train_log
  grad_clip_norm: 2
  num_workers: 12
  pin_memory: false

  optimizer:
    lr: 0.001
    betas: [0.95, 0.99]
    weight_decay: 0.01

  overlaps: [0.7]
  similar_classes:
    Van: Car
  difficulties: [0, 1, 2]
  summary:
    record_for: []
    max_pts:
    use_reference: false
    max_outputs: 1
